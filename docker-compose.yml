x-api: &api
  profiles: ["ha"]
  image: servicedesk-api:local
  build: .
  restart: on-failure
  depends_on:
    - postgres
  environment:
    DATABASE_URL: postgres://desk:desk@postgres:5432/desk
    HOST: 0.0.0.0
    PORT: "3000"
    # Shared fallback key for local demos only.
    MASK_KEY: ${MASK_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    LIVE_MODEL: ${LIVE_MODEL:-0}
    MODEL_API_KEY: ${MODEL_API_KEY:-}
    MODEL_BASE_URL: ${MODEL_BASE_URL:-}
    MODEL_ID: ${MODEL_ID:-}
  healthcheck:
    test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:3000/healthz')).ok ? 0 : 1)"]
    interval: 5s
    timeout: 3s
    retries: 12

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: desk
      POSTGRES_DB: desk
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api-1: *api
  api-2: *api
  nginx:
    profiles: ["ha"]
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
volumes:
  pgdata:
