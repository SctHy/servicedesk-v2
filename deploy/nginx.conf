upstream servicedesk_api {
    zone servicedesk_api 64k;
    server api-1:3000 max_fails=2 fail_timeout=5s;
    server api-2:3000 max_fails=2 fail_timeout=5s;
}

server {
    listen 80;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header traceparent $http_traceparent;
    proxy_set_header x-demo-user $http_x_demo_user;
    proxy_set_header Authorization $http_authorization;
    add_header X-Upstream-Addr $upstream_addr always;

    location / {
        proxy_pass http://servicedesk_api;
    }

    location = /api/events {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
        proxy_pass http://servicedesk_api;
    }

    location ~ ^/api/runs/[^/]+/events$ {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
        proxy_pass http://servicedesk_api;
    }
}
