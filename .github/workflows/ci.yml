name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U desk -d desk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run web:build
      - run: bun test
        env:
          TEST_DATABASE_URL: postgres://desk:desk@127.0.0.1:5433/desk_test
      - run: bun run eval:privacy
      - run: bun run eval:paired
        env:
          LIVE_MODEL: '0'
      - run: bun run eval:workflow
        env:
          LIVE_MODEL: '0'
